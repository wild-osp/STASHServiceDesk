<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STASHServiceDesk</title>
    <style>
        :root {
            --bg-primary: #0b1a2f;
            --bg-secondary: #112240;
            --bg-card: #1a2d4a;
            --text-primary: #e8edf3;
            --text-secondary: #8ba0c7;
            --accent: #f5a623;
            --shadow: 0 4px 20px rgba(0,0,0,0.4);
            --radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 16px;
            min-height: 100vh;
            padding-bottom: 80px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 16px;
            border-bottom: 2px solid var(--accent);
            margin-bottom: 20px;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-icon { font-size: 28px; font-weight: 700; color: var(--accent); }
        .header-icon span { color: var(--text-primary); }
        .header h1 { font-size: 18px; font-weight: 600; }
        .header h1 small { display: block; font-size: 10px; font-weight: 400; color: var(--text-secondary); text-transform: uppercase; }
        .header-badge { background: var(--accent); color: var(--bg-primary); font-weight: 700; padding: 4px 14px; border-radius: 20px; font-size: 14px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: var(--bg-secondary); border-radius: var(--radius); padding: 14px 8px; text-align: center; border-bottom: 3px solid var(--accent); }
        .stat-number { font-size: 26px; font-weight: 700; color: var(--accent); }
        .stat-label { font-size: 10px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
        .search-wrapper { position: relative; margin-bottom: 16px; }
        .search-wrapper input { width: 100%; padding: 12px 16px; border: 1px solid var(--bg-secondary); border-radius: var(--radius); font-size: 15px; background: var(--bg-secondary); color: var(--text-primary); outline: none; }
        .search-wrapper input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.2); }
        .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .filter-btn { padding: 6px 16px; border: 1px solid var(--bg-secondary); border-radius: 20px; background: transparent; color: var(--text-secondary); font-size: 12px; font-weight: 600; cursor: pointer; }
        .filter-btn.active { background: var(--accent); border-color: var(--accent); color: var(--bg-primary); }
        .order-list { display: flex; flex-direction: column; gap: 12px; }
        .order-card { background: var(--bg-secondary); border-radius: var(--radius); padding: 16px; cursor: pointer; border-left: 4px solid var(--accent); }
        .order-card .top-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .order-number { font-weight: 700; font-size: 16px; }
        .order-status { font-size: 11px; font-weight: 600; padding: 3px 12px; border-radius: 12px; text-transform: uppercase; }
        .status-new { background: #1e3a5f; color: #93bbfc; }
        .status-repair { background: #5f3a1e; color: #fbbf7c; }
        .status-consultation { background: #4a1e5f; color: #d8b4fe; }
        .status-waiting { background: #5f4a1e; color: #fcd34d; }
        .status-warranty { background: #1e4a3a; color: #6ee7a7; }
        .status-ready { background: #1e3a2a; color: #34d399; }
        .status-notpaid { background: #4a1e1e; color: #fca5a5; }
        .status-paid { background: #1a3a2a; color: #86efac; }
        .status-default { background: #2d2d3f; color: #9ca3af; }
        .order-card .info { margin-top: 8px; font-size: 13px; color: var(--text-secondary); display: flex; flex-wrap: wrap; gap: 8px 16px; }
        .order-card .device { margin-top: 6px; font-size: 14px; color: var(--text-primary); font-weight: 500; }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
        .loader { text-align: center; padding: 40px 0; color: var(--text-secondary); }
        .spinner { width: 36px; height: 36px; border: 3px solid var(--bg-secondary); border-top: 3px solid var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 999; padding: 20px; align-items: flex-end; justify-content: center; }
        .modal.active { display: flex; animation: modalIn 0.3s ease; }
        @keyframes modalIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .modal-content { background: var(--bg-secondary); border-radius: var(--radius); max-width: 500px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 24px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid var(--accent); }
        .modal-header h2 { font-size: 18px; font-weight: 700; color: var(--accent); }
        .modal-close { background: none; border: none; font-size: 24px; color: var(--text-secondary); cursor: pointer; }
        .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        .detail-row .label { color: var(--text-secondary); }
        .detail-row .value { font-weight: 500; text-align: right; }
        .contact-btn { flex: 1; min-width: 56px; color: white; padding: 10px 8px; border-radius: var(--radius); font-size: 13px; font-weight: 600; text-align: center; border: none; cursor: pointer; background: var(--bg-card); border-bottom: 3px solid transparent; }
        .contact-btn.call { background: #1a3a2a; border-bottom-color: #22c55e; color: #86efac; }
        .contact-btn.viber { background: #2a1a4a; border-bottom-color: #8b5cf6; color: #c4b5fd; }
        .contact-btn.telegram { background: #1a2a4a; border-bottom-color: #3b82f6; color: #93bbfc; }
        .contact-btn.copy { background: #2a2a3a; border-bottom-color: var(--text-secondary); color: var(--text-secondary); flex: 0.4; min-width: 44px; }
        #dashboardPanel { background: var(--bg-secondary); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; border-left: 4px solid var(--accent); }
        #dashboardPanel h3 { color: var(--accent); margin-bottom: 12px; font-size: 16px; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .dashboard-item { background: var(--bg-card); padding: 10px; border-radius: 8px; }
        .dashboard-item .value { font-size: 20px; font-weight: 700; color: var(--accent); }
        .problem-item { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .problem-item .count { color: var(--accent); }
        .chart-bars { display: flex; gap: 4px; height: 40px; align-items: flex-end; }
        .chart-bar { flex: 1; display: flex; flex-direction: column; align-items: center; }
        .chart-bar .bar { background: var(--accent); width: 100%; border-radius: 4px; min-height: 4px; }
        .chart-bar .day-label { font-size: 8px; color: var(--text-secondary); margin-top: 2px; }
        .access-denied { text-align: center; padding: 60px 20px; }
        .access-denied .icon { font-size: 64px; }
        .access-denied h2 { color: var(--accent); }
        .access-denied p { color: var(--text-secondary); }
        @media (max-width: 480px) { body { padding: 12px; } .stats-grid { gap: 6px; } .stat-number { font-size: 20px; } }
        @media (min-width: 600px) { .order-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } }
        @media (min-width: 900px) { .order-list { grid-template-columns: 1fr 1fr 1fr; } body { max-width: 1100px; margin: 0 auto; } }
    </style>
</head>
<body>

    <div id="loadingScreen" style="text-align:center;padding:60px 20px;">
        <div class="spinner"></div>
        <p>Проверка доступа...</p>
    </div>

    <div id="accessDenied" class="access-denied" style="display:none;">
        <div class="icon">🔒</div>
        <h2>Доступ запрещен</h2>
        <p id="errorMessage">Пользователь не найден</p>
    </div>

    <div id="app" style="display:none;">
        <div class="header">
            <div class="header-left">
                <div class="header-icon">ST<span>ASH</span></div>
                <div>
                    <h1 id="userGreeting">ServiceDesk <small>сервисный центр</small></h1>
                </div>
            </div>
            <span class="header-badge" id="totalBadge">0</span>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><div class="stat-number" id="statTotal">0</div><div class="stat-label">Всего заказов</div></div>
            <div class="stat-card"><div class="stat-number" id="statToday">0</div><div class="stat-label">Сегодня</div></div>
            <div class="stat-card"><div class="stat-number" id="statStatuses">0</div><div class="stat-label">Статусов</div></div>
        </div>

        <div id="dashboardPanel"><h3>📊 Аналитика</h3><div id="dashboardContent"><div class="loader"><div class="spinner"></div>Загрузка аналитики...</div></div></div>

        <div class="search-wrapper"><input type="text" id="searchInput" placeholder="🔍 Поиск по номеру, телефону, ФИО, устройству..." /></div>

        <div class="filters" id="filters">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="Принят в ремонт">Принят</button>
            <button class="filter-btn" data-filter="В ремонте">Ремонт</button>
            <button class="filter-btn" data-filter="Согласование с клиентом">Согласование</button>
            <button class="filter-btn" data-filter="Ожидание запчасти">Ожидание</button>
            <button class="filter-btn" data-filter="Гарантия">Гарантия</button>
            <button class="filter-btn" data-filter="Готово">Готово</button>
            <button class="filter-btn" data-filter="Выдано (не оплачено)">Не оплачено</button>
            <button class="filter-btn" data-filter="Выдано (оплачено)">Оплачено</button>
        </div>

        <div class="order-list" id="orderList"><div class="loader"><div class="spinner"></div>Загрузка заказов...</div></div>

        <div class="modal" id="modal">
            <div class="modal-content">
                <div class="modal-header"><h2 id="modalTitle">Заказ</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
                <div id="modalBody"></div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. ПОЛУЧАЕМ USER_ID ИЗ URL
        // ============================================================
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id');

        if (!userId) {
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('accessDenied').style.display = 'block';
            document.getElementById('errorMessage').textContent = 'Ошибка: не передан ID пользователя';
        } else {
            // ============================================================
            // 2. ПРОВЕРЯЕМ ПОЛЬЗОВАТЕЛЯ
            // ============================================================
            fetch('/api/auth/check', {
                headers: {
                    'X-User-Id': userId
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('loadingScreen').style.display = 'none';
                    document.getElementById('app').style.display = 'block';
                    
                    const user = data.user;
                    const roleLabel = user.role === 'superadmin' ? '🌟 Суперадмин' : 
                                      user.role === 'admin' ? '👔 Администратор' : '👤 Сотрудник';
                    document.getElementById('userGreeting').innerHTML = 
                        `Привет, ${user.full_name}! <small style="display:block;font-size:10px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:1px;">${roleLabel}</small>`;
                    
                    // Загружаем данные
                    loadOrders();
                    loadDashboard();
                } else {
                    document.getElementById('loadingScreen').style.display = 'none';
                    document.getElementById('accessDenied').style.display = 'block';
                    document.getElementById('errorMessage').textContent = data.detail || 'Пользователь не найден';
                }
            })
            .catch(() => {
                document.getElementById('loadingScreen').style.display = 'none';
                document.getElementById('accessDenied').style.display = 'block';
                document.getElementById('errorMessage').textContent = 'Ошибка соединения с сервером';
            });
        }

        // ============================================================
        // 3. ОСТАЛЬНЫЕ ФУНКЦИИ (без изменений)
        // ============================================================
        const $ = id => document.getElementById(id);
        const orderList = $('orderList');
        const searchInput = $('searchInput');
        const filtersEl = $('filters');
        const modal = $('modal');
        const modalTitle = $('modalTitle');
        const modalBody = $('modalBody');
        const dashboardPanel = $('dashboardPanel');
        const dashboardContent = $('dashboardContent');

        const statusMap = {
            'Принят в ремонт': 'new',
            'В ремонте': 'repair',
            'Согласование с клиентом': 'consultation',
            'Ожидание запчасти': 'waiting',
            'Гарантия': 'warranty',
            'Готово': 'ready',
            'Выдано (не оплачено)': 'notpaid',
            'Выдано (оплачено)': 'paid'
        };

        function getStatusClass(status) { return statusMap[status] || 'default'; }
        function escapeHtml(text) { if (!text) return '—'; const d = document.createElement('div'); d.textContent = text; return d.innerHTML; }

        function openViber(phone) {
            const clean = phone.replace(/[^0-9]/g, '');
            const win = window.open('viber://chat?number=' + clean, '_blank');
            if (!win || win.closed) alert('Viber не установлен.\nНомер: ' + phone);
        }
        function openTelegram(phone) {
            const clean = phone.replace(/[^0-9]/g, '');
            const win = window.open('tg://resolve?phone=' + clean, '_blank');
            if (!win || win.closed) alert('Telegram не открылся.\nНомер: ' + phone);
        }
        function copyPhone(phone) {
            if (navigator.clipboard?.writeText) {
                navigator.clipboard.writeText(phone).then(() => alert('📋 Номер скопирован: ' + phone));
            } else { alert('📱 Номер: ' + phone); }
        }

        let allOrders = [], currentFilter = 'all', searchQuery = '';

        async function loadOrders() {
            try {
                const response = await fetch('/api/orders?limit=200');
                const result = await response.json();
                if (result.success) {
                    allOrders = result.data;
                    updateStats(result.pagination.total);
                    renderOrders();
                }
            } catch (e) { showError('Ошибка загрузки заказов'); }
        }

        function updateStats(total) {
            $('totalBadge').textContent = total;
            $('statTotal').textContent = total;
            const today = new Date().toISOString().slice(0,10);
            $('statToday').textContent = allOrders.filter(o => o.date === today).length;
            $('statStatuses').textContent = new Set(allOrders.map(o => o.status).filter(Boolean)).size;
        }

        function renderOrders() {
            let filtered = allOrders;
            if (currentFilter !== 'all') filtered = filtered.filter(o => o.status === currentFilter);
            const q = searchQuery.trim().toLowerCase();
            if (q) {
                filtered = filtered.filter(o =>
                    (o.order_number || '').includes(q) ||
                    (o.phone || '').includes(q) ||
                    (o.client_name || '').toLowerCase().includes(q) ||
                    (o.device || '').toLowerCase().includes(q) ||
                    (o.problem || '').toLowerCase().includes(q)
                );
            }
            if (filtered.length === 0) {
                orderList.innerHTML = '<div class="empty-state"><div class="big-icon">📭</div><h3>Заказов не найдено</h3><p>Попробуйте изменить фильтр или поиск</p></div>';
                return;
            }
            orderList.innerHTML = filtered.map(order => `
                <div class="order-card" onclick="openOrder(${order.id})">
                    <div class="top-row">
                        <span class="order-number">#${escapeHtml(order.order_number)}</span>
                        <span class="order-status status-${getStatusClass(order.status)}">${escapeHtml(order.status) || 'Новый'}</span>
                    </div>
                    <div class="info">
                        <span><span class="emoji">👤</span> ${escapeHtml(order.client_name) || 'Не указан'}</span>
                        <span><span class="emoji">📱</span> ${escapeHtml(order.phone) || 'Не указан'}</span>
                    </div>
                    <div class="device">🖥️ ${escapeHtml(order.device) || 'Устройство не указано'}</div>
                </div>
            `).join('');
        }

        async function openOrder(orderId) {
            try {
                const response = await fetch('/api/orders/' + orderId);
                const result = await response.json();
                if (result.success) showModal(result.data);
            } catch (e) { console.error(e); }
        }

        function showModal(order) {
            modalTitle.textContent = '#' + order.order_number;
            let contactsHtml = '';
            const phone = order.phone || '';
            let cleanPhone = phone.replace(/[^0-9+]/g, '');
            if (cleanPhone.startsWith('8') && cleanPhone.length === 11) cleanPhone = '+7' + cleanPhone.slice(1);
            if (!cleanPhone.startsWith('+') && cleanPhone.length > 0) cleanPhone = '+' + cleanPhone;
            if (cleanPhone && cleanPhone.length > 4) {
                contactsHtml = `
                    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px;">
                        <a href="tel:${cleanPhone}" class="contact-btn call">📞 Позвонить</a>
                        <button class="contact-btn viber" onclick="openViber('${cleanPhone}')">💬 Viber</button>
                        <button class="contact-btn telegram" onclick="openTelegram('${cleanPhone}')">✈️ Telegram</button>
                        <button class="contact-btn copy" onclick="copyPhone('${phone}')">📋</button>
                    </div>
                    <div style="font-size:12px;color:var(--text-secondary);text-align:center;margin-bottom:8px;">📱 ${phone}</div>
                `;
            }
            const historyHtml = order.history?.length > 0 ?
                '<div class="history-title">📜 История статусов</div>' +
                order.history.map(h => `
                    <div class="history-item">
                        <span class="h-status">${escapeHtml(h.status)}</span>
                        <span>${h.changed_at ? h.changed_at.slice(0,16).replace('T',' ') : ''}</span>
                    </div>
                `).join('') :
                '<div style="margin-top:12px;color:var(--text-secondary);font-size:13px;">Нет истории статусов</div>';
            
            modalBody.innerHTML = contactsHtml + `
                <div class="detail-row"><span class="label">Статус</span><span class="value"><span class="status-badge status-${getStatusClass(order.status)}">${escapeHtml(order.status) || 'Новый'}</span></span></div>
                <div class="detail-row"><span class="label">Дата приема</span><span class="value">${escapeHtml(order.date) || '—'}</span></div>
                <div class="detail-row"><span class="label">Приёмщик</span><span class="value">${escapeHtml(order.receiver) || '—'}</span></div>
                <div class="detail-row"><span class="label">Клиент</span><span class="value">${escapeHtml(order.client_name) || '—'}</span></div>
                <div class="detail-row"><span class="label">Телефон</span><span class="value">${escapeHtml(order.phone) || '—'}</span></div>
                <div class="detail-row"><span class="label">Устройство</span><span class="value">${escapeHtml(order.device) || '—'}</span></div>
                <div class="detail-row" style="border-bottom:none;"><span class="label">Неисправность</span><span class="value">${escapeHtml(order.problem) || '—'}</span></div>
                ${historyHtml}
            `;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() { modal.classList.remove('active'); document.body.style.overflow = ''; }
        modal.addEventListener('click', function(e) { if (e.target === this) closeModal(); });

        function showError(msg) {
            orderList.innerHTML = '<div class="empty-state"><div class="big-icon">⚠️</div><h3>Ошибка</h3><p>' + msg + '</p></div>';
        }

        searchInput.addEventListener('input', function() { searchQuery = this.value; renderOrders(); });
        filtersEl.addEventListener('click', function(e) {
            const btn = e.target.closest('.filter-btn');
            if (!btn) return;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            renderOrders();
        });

        async function loadDashboard() {
            if (!['admin', 'superadmin'].includes(window.USER_ROLE || '')) {
                dashboardPanel.style.display = 'none';
                return;
            }
            try {
                const response = await fetch('/api/admin/dashboard');
                const data = await response.json();
                if (data.success) {
                    const stats = data.data;
                    const maxCount = stats.orders_by_day.length > 0 ? Math.max(...stats.orders_by_day.map(x => x.count)) : 1;
                    dashboardContent.innerHTML = `
                        <div class="dashboard-grid">
                            <div class="dashboard-item"><div style="font-size:11px;color:var(--text-secondary);">Среднее время ремонта</div><div class="value">${stats.avg_repair_time} дн.</div></div>
                            <div class="dashboard-item"><div style="font-size:11px;color:var(--text-secondary);">Всего заказов</div><div class="value">${stats.total_orders}</div></div>
                        </div>
                        <div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px;">Топ-5 неисправностей</div>
                        ${stats.top_problems.map(p => '<div class="problem-item"><span>' + (p.problem || 'Без описания') + '</span><span class="count">' + p.count + '</span></div>').join('')}
                        <div style="font-size:12px;color:var(--text-secondary);margin-top:8px;margin-bottom:4px;">Заказы по дням</div>
                        <div class="chart-bars">${stats.orders_by_day.slice(0,7).reverse().map(d => `
                            <div class="chart-bar"><div class="bar" style="height:${Math.max(4, (d.count / maxCount) * 40)}px;"></div><div class="day-label">${d.date || '—'}</div></div>
                        `).join('')}</div>
                    `;
                }
            } catch (e) { dashboardContent.innerHTML = '<div class="empty-state">⚠️ Ошибка загрузки</div>'; }
        }

        // Сохраняем роль для dashboard
        fetch('/api/auth/check', { headers: { 'X-User-Id': userId } })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    window.USER_ROLE = data.user.role;
                }
            });
    </script>
</body>
</html>
